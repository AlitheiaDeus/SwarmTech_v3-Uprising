<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SwarmTech3_UpRising | Tactical WebGL GCS</title>
  <meta name="description" content="50/50 Autonomous Drone Swarm Simulation and Hardware-Accelerated 3D WebGL Ground Control Station.">
  <link rel="stylesheet" href="css/style.css">
  
  <!-- Three.js (r128) & OrbitControls from CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <!-- Top Tactical Telemetry Header -->
  <header id="top-bar">
    <div class="brand-section">
      <span class="brand-logo">&#x25C7; SWARMTECH-3</span>
      <span class="brand-badge">UPRISING // 50:50</span>
    </div>

    <div class="status-section">
      <div class="status-pill">
        <div id="hud-conn-ind" class="status-indicator"></div>
        <span id="hud-conn-text">CONNECTING...</span>
      </div>

      <div class="status-pill">
        BRAIN: <strong id="hud-brain">LEADER_FOLLOWER</strong>
      </div>

      <div class="status-pill">
        FORMATION: <strong id="hud-mode">ECHELON_ESCORT</strong>
      </div>

      <div class="status-pill">
        FLEET: <strong id="hud-drones">--/--</strong>
      </div>

      <div class="status-pill">
        SIM TIME: <strong id="hud-sim-time">0.0s</strong>
      </div>

      <div class="status-pill">
        GPU: <strong id="hud-fps">60 FPS</strong>
      </div>
    </div>
  </header>

  <!-- 3D WebGL Canvas Viewport -->
  <main id="viewport-container"></main>

  <!-- Camera Controls Hint -->
  <div id="camera-hints">
    <div><span>[L-DRAG]</span> ORBIT</div>
    <div><span>[R-DRAG]</span> PAN</div>
    <div><span>[WHEEL]</span> ZOOM</div>
    <div><span>[C]</span> CHASE CAM</div>
    <div><span>[R]</span> RESET CAM</div>
  </div>

  <!-- Telemetry Client & Three.js Viewport App -->
  <script src="js/ws_client.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
